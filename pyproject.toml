[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raum27"
version = "0.1.0"
description = "Rational-space geometry and fractal attractors: the checkable mathematical core extracted from the RAUM27 notes."
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["raum27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, a bare `pytest` fails to import the package and every
# test errors during collection; only `PYTHONPATH=. python -m pytest`
# worked. Reported by an external review and fixed here, so the command
# the README documents is the command that actually runs.
pythonpath = ["."]
